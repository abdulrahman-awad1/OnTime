# OnTime API — upload limits for medical attachments (X-ray / lab results).
# Only needed if nginx (or another reverse proxy) sits in front of the Laravel app.
# Must be >= PHP post_max_size (12M, see Dockerfile), otherwise nginx answers 413
# WITHOUT CORS headers and the browser reports it as a network error.
#
# Put this inside the server {} block for api.<your-domain>, then: nginx -t && nginx -s reload

client_max_body_size 12m;
